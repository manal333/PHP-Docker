name: Docker Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Semgrep
        run: |
          semgrep ci \
            --config p/security-audit \
            --config p/php \
            --json \
            --output semgrep-report.json

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs-report.json
          exit-code: '0'

      - name: Build Docker images
        run: docker compose -f compose.prod.yaml build

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-web:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-web-report.json
          exit-code: '0'

      - name: Scan php-fpm image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-php-fpm-report.json
          exit-code: '0'

      - name: Scan supervisor image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-supervisor-report.json
          exit-code: '0'

      - name: Scan php-cli image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-php-cli-report.json
          exit-code: '0'

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            semgrep-report.json
            trivy-fs-report.json
            trivy-web-report.json
            trivy-php-fpm-report.json
            trivy-supervisor-report.json
            trivy-php-cli-report.json
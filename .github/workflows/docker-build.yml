name: Docker Build

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # 1. SonarCloud Scan
  # ============================================================
  sonarcloud:
    name: SonarCloud Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ============================================================
  # 2. Trivy Filesystem Scan
  # ============================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs-report.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload Trivy FS SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-report.sarif
          category: trivy-fs



  # ============================================================
  # 3. Semgrep Scan
  # ============================================================
  semgrep:
    name: Semgrep Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: |
          ~/actions-runner/semgrep-venv/bin/pip install semgrep

      - name: Run Semgrep
        run: |
          ~/actions-runner/semgrep-venv/bin/semgrep scan \
            --config p/security-audit \
            --config p/php \
            --error \
            --json \
            --output semgrep-report.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore


  # ============================================================
  # 4. Build Docker Images
  # ============================================================
  build:
    name: Build Docker Images
    runs-on: self-hosted
    needs:
      - sonarcloud
      - trivy-fs
      - semgrep

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync application files
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.cache/' \
            ./ /var/www/PHP-Docker/

      - name: Build Docker images
        working-directory: /var/www/PHP-Docker
        run: |
          docker compose -f compose.prod.yaml build


  # ============================================================
  # 5. Trivy Web Image Scan
  # ============================================================
  trivy-web:
    name: Trivy Web Image
    runs-on: self-hosted
    needs: build

    steps:

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-web:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-web-report.json
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload web image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-web-report
          path: trivy-web-report.json
          if-no-files-found: ignore


  # ============================================================
  # 6. Trivy PHP-FPM Image Scan
  # ============================================================
  trivy-php-fpm:
    name: Trivy PHP-FPM Image
    runs-on: self-hosted
    needs: build

    steps:

      - name: Generate php-fpm SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          format: cyclonedx
          output: sbom-php-fpm.json

      - name: Scan php-fpm image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-php-fpm-report.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload PHP-FPM SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-php-fpm-report.sarif
          category: trivy-php-fpm

      - name: Upload php-fpm SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-php-fpm
          path: sbom-php-fpm.json
          if-no-files-found: ignore


  # ============================================================
  # 7. Trivy Supervisor Image Scan
  # ============================================================
  trivy-supervisor:
    name: Trivy Supervisor Image
    runs-on: self-hosted
    needs: build

    steps:

      - name: Generate supervisor SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          format: cyclonedx
          output: sbom-supervisor.json

      - name: Scan supervisor image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-supervisor-report.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload Supervisor SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-supervisor-report.sarif
          category: trivy-supervisor


      - name: Upload supervisor SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-supervisor
          path: sbom-supervisor.json
          if-no-files-found: ignore


  # ============================================================
  # 8. Trivy PHP-CLI Image Scan
  # ============================================================
  trivy-php-cli:
    name: Trivy PHP-CLI Image
    runs-on: self-hosted
    needs: build

    steps:

      - name: Generate php-cli SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          format: cyclonedx
          output: sbom-php-cli.json

      - name: Scan php-cli image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-php-cli-report.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload PHP-CLI SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-php-cli-report.sarif
          category: trivy-php-cli

      - name: Upload php-cli SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-php-cli
          path: sbom-php-cli.json
          if-no-files-found: ignore


  # ============================================================
  # 9. Deploy Application + Health Check
  # ============================================================
  deploy:
    name: Deploy & Health Check
    runs-on: self-hosted
    needs:
      - trivy-web
      - trivy-php-fpm
      - trivy-supervisor
      - trivy-php-cli

    steps:

      - name: Start application
        working-directory: /var/www/PHP-Docker
        run: |
          docker compose -f compose.prod.yaml up -d

      - name: Wait for application
        working-directory: /var/www/PHP-Docker
        run: |
          echo "Waiting for application to become ready..."

          for i in {1..30}; do
            if curl -fs http://localhost:8088 > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi

            echo "Application is not ready yet... attempt $i/30"
            sleep 5
          done

          echo "Application did not become ready."

          echo "===== Docker Compose Status ====="
          docker compose -f compose.prod.yaml ps

          echo "===== Docker Compose Logs ====="
          docker compose -f compose.prod.yaml logs

          exit 1


  # ============================================================
  # 10. DAST - OWASP ZAP
  # ============================================================
  dast:
    name: DAST - OWASP ZAP
    runs-on: self-hosted
    needs: deploy

    steps:

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8088'
          allow_issue_writing: false

  # ============================================================
  # 11. Cleanup
  # ============================================================
  cleanup:
    name: Cleanup
    runs-on: self-hosted
    needs:
      - sonarcloud
      - trivy-fs
      - semgrep
      - trivy-web
      - trivy-php-fpm
      - trivy-supervisor
      - trivy-php-cli
      - deploy
      - dast
    if: always()

    steps:

      - name: Stop application
        if: always()
        working-directory: /var/www/PHP-Docker
        run: |
          docker compose -f compose.prod.yaml down

      - name: Clean Docker build cache
        if: always()
        run: |
          docker builder prune -af
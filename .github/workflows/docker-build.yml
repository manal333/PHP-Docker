name: Docker Build

on:
  push:
    branches:
      - main

jobs:

  # ============================================================
  # 1. SonarCloud Scan
  # ============================================================
  sonarcloud:
    name: SonarCloud Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ============================================================
  # 2. Trivy Filesystem Scan
  # ============================================================
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs-report.json
          exit-code: '0'


  # ============================================================
  # 3. Semgrep Scan
  # ============================================================
  semgrep:
    name: Semgrep Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: |
          ~/actions-runner/semgrep-venv/bin/pip install semgrep

      - name: Run Semgrep
        run: |
          ~/actions-runner/semgrep-venv/bin/semgrep ci \
            --config p/security-audit \
            --config p/php \
            --json \
            --output semgrep-report.json


  # ============================================================
  # 4. Build Docker Images
  # ============================================================
  build:
    name: Build Docker Images
    runs-on: self-hosted
    needs:
      - sonarcloud
      - trivy-fs
      - semgrep

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync application files
        run: |
          rsync -av --delete \
            --exclude='.env' \
            --exclude='.cache/' \
            ./ /var/www/PHP-Docker/

      - name: Build Docker images
        working-directory: /var/www/PHP-Docker
        run: |
          docker compose -f compose.prod.yaml build


  # ============================================================
  # 5. Trivy Web Image Scan
  # ============================================================
  trivy-web:
    name: Trivy Web Image
    runs-on: self-hosted
    needs: build

    steps:

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-web:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-web-report.json
          exit-code: '0'

      - name: Upload web image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-web-report
          path: trivy-web-report.json
          if-no-files-found: ignore


  # ============================================================
  # 6. Trivy PHP-FPM Image Scan
  # ============================================================
  trivy-php-fpm:
    name: Trivy PHP-FPM Image
    runs-on: self-hosted
    needs: build

    steps:

      - name: Scan php-fpm image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-php-fpm-report.json
          exit-code: '0'

      - name: Upload php-fpm image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-php-fpm-report
          path: trivy-php-fpm-report.json
          if-no-files-found: ignore


  # ============================================================
  # 7. Trivy Supervisor Image Scan
  # ============================================================
  trivy-supervisor:
    name: Trivy Supervisor Image
    runs-on: self-hosted
    needs: build

    steps:

      - name: Scan supervisor image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-supervisor-report.json
          exit-code: '0'

      - name: Upload supervisor image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-supervisor-report
          path: trivy-supervisor-report.json
          if-no-files-found: ignore


  # ============================================================
  # 8. Trivy PHP-CLI Image Scan
  # ============================================================
  trivy-php-cli:
    name: Trivy PHP-CLI Image
    runs-on: self-hosted
    needs: build

    steps:

      - name: Scan php-cli image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-php-cli-report.json
          exit-code: '0'

      - name: Upload php-cli image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-php-cli-report
          path: trivy-php-cli-report.json
          if-no-files-found: ignore


  # ============================================================
  # 9. Deploy Application + Health Check
  # ============================================================
  deploy:
    name: Deploy & Health Check
    runs-on: self-hosted
    needs:
      - trivy-web
      - trivy-php-fpm
      - trivy-supervisor
      - trivy-php-cli

    steps:

      - name: Start application
        working-directory: /var/www/PHP-Docker
        run: |
          docker compose -f compose.prod.yaml up -d

      - name: Wait for application
        working-directory: /var/www/PHP-Docker
        run: |
          echo "Waiting for application to become ready..."

          for i in {1..30}; do
            if curl -fs http://localhost:8088 > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi

            echo "Application is not ready yet... attempt $i/30"
            sleep 5
          done

          echo "Application did not become ready."

          echo "===== Docker Compose Status ====="
          docker compose -f compose.prod.yaml ps

          echo "===== Docker Compose Logs ====="
          docker compose -f compose.prod.yaml logs

          exit 1


  # ============================================================
  # 10. DAST - OWASP ZAP
  # ============================================================
  dast:
    name: DAST - OWASP ZAP
    runs-on: self-hosted
    needs: deploy

    steps:

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8088'
          allow_issue_writing: false


  # ============================================================
  # 11. Upload Security Reports & Cleanup
  # ============================================================
  reports:
    name: Upload Security Reports & Cleanup
    runs-on: self-hosted
    needs:
      - sonarcloud
      - trivy-fs
      - semgrep
      - trivy-web
      - trivy-php-fpm
      - trivy-supervisor
      - trivy-php-cli
      - deploy
      - dast
    if: always()

    steps:

      - name: Download Trivy FS report
        uses: actions/download-artifact@v4
        with:
          name: trivy-fs-report
          path: reports

      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-report
          path: reports

      - name: Download Trivy web report
        uses: actions/download-artifact@v4
        with:
          name: trivy-web-report
          path: reports

      - name: Download Trivy PHP-FPM report
        uses: actions/download-artifact@v4
        with:
          name: trivy-php-fpm-report
          path: reports

      - name: Download Trivy Supervisor report
        uses: actions/download-artifact@v4
        with:
          name: trivy-supervisor-report
          path: reports

      - name: Download Trivy PHP-CLI report
        uses: actions/download-artifact@v4
        with:
          name: trivy-php-cli-report
          path: reports

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            reports/*.json
          if-no-files-found: ignore

      - name: Stop application
        if: always()
        working-directory: /var/www/PHP-Docker
        run: |
          docker compose -f compose.prod.yaml down
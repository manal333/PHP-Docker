name: Semgrep Security Scan

on:
  push:
    branches:
      - security/semgrep

jobs:

  semgrep:
    name: Semgrep Scan
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: |
          ~/actions-runner/semgrep-venv/bin/pip install semgrep

      - name: Run Semgrep
        run: |
          ~/actions-runner/semgrep-venv/bin/semgrep scan \
            --config p/security-audit \
            --config p/php \
            --error \
            --json \
            --output semgrep-report.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore
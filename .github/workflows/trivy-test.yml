name: Trivy Test

on:
  push:
    branches:
      - security/trivy-fixes

permissions:
  contents: read
  security-events: write

jobs:

  # =========================
  # Trivy Filesystem Security Scan
  # =========================

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs-report.sarif
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload Trivy FS SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-report.sarif
          category: trivy-fs


  # =========================
  # Trivy Docker Images
  # =========================

  trivy-images:
    name: Trivy Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f compose.prod.yaml build


      # =========================
      # PHP-FPM
      # =========================

      - name: Scan php-fpm image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-php-fpm-report.sarif
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload PHP-FPM SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-php-fpm-report.sarif
          category: trivy-php-fpm


      # =========================
      # Supervisor
      # =========================

      - name: Scan supervisor image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-supervisor-report.sarif
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload Supervisor SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-supervisor-report.sarif
          category: trivy-supervisor


      # =========================
      # PHP-CLI
      # =========================

      - name: Scan php-cli image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-php-cli-report.sarif
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload PHP-CLI SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-php-cli-report.sarif
          category: trivy-php-cli
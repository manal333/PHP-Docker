name: Trivy Test

on:
  push:
    branches:
      - security/trivy-fixes

jobs:

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs-report.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload Trivy FS SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-report.sarif
          category: trivy-fs

  trivy-images:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f compose.prod.yaml build

      - name: Generate php-fpm SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          format: cyclonedx
          output: sbom-php-fpm.json

      - name: Scan php-fpm image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-php-fpm-report.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload PHP-FPM SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-php-fpm-report.sarif
          category: trivy-php-fpm

      - name: Generate supervisor SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          format: cyclonedx
          output: sbom-supervisor.json

      - name: Scan supervisor image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-supervisor-report.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload Supervisor SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-supervisor-report.sarif
          category: trivy-supervisor

      - name: Generate php-cli SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          format: cyclonedx
          output: sbom-php-cli.json

      - name: Scan php-cli image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-php-cli-report.sarif
          limit-severities-for-sarif: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload PHP-CLI SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-php-cli-report.sarif
          category: trivy-php-cli

      - name: Upload Trivy SBOM reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            sbom-php-fpm.json
            sbom-supervisor.json
            sbom-php-cli.json
          if-no-files-found: ignore
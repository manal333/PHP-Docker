name: Trivy Test

on:
  push:
    branches:
      - security/trivy-fixes

jobs:

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: trivy-fs-report.json
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Upload Trivy FS report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          if-no-files-found: ignore

  trivy-images:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose -f compose.prod.yaml build

      - name: Generate php-fpm SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          format: cyclonedx
          output: sbom-php-fpm.json

      - name: Scan php-fpm image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-fpm:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-php-fpm-report.json
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Generate supervisor SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          format: cyclonedx
          output: sbom-supervisor.json

      - name: Scan supervisor image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-supervisor:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-supervisor-report.json
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Generate php-cli SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          format: cyclonedx
          output: sbom-php-cli.json

      - name: Scan php-cli image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: php-docker-php-cli:latest
          severity: HIGH,CRITICAL
          format: json
          output: trivy-php-cli-report.json
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-php-fpm-report.json
            trivy-supervisor-report.json
            trivy-php-cli-report.json
            sbom-php-fpm.json
            sbom-supervisor.json
            sbom-php-cli.json
          if-no-files-found: ignore